# Dịch vụ cho máy phát triển: PostgreSQL, Redis, SeaweedFS (lưu tệp, API S3), Mailpit (bắt email).
#   npm run infra:up      khởi động và chờ tất cả healthy
#   npm run infra:down    dừng (giữ dữ liệu)
#   npm run infra:reset   dừng và XÓA toàn bộ dữ liệu
# Mọi cổng chỉ mở trên 127.0.0.1. Giá trị mặc định dưới đây chỉ dùng cho máy local; đổi được qua tệp .env (xem .env.example).
name: tps-connection

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tps_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tps}
      TZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      # PostgreSQL 18: gắn volume ở /var/lib/postgresql (không phải .../data như bản cũ).
      - pg18-data:/var/lib/postgresql
      # Chạy một lần khi volume còn trống: bật extension, tạo database cho test.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine
    # appendonly: giữ hàng đợi BullMQ khi khởi động lại. noeviction: BullMQ yêu cầu, không được tự xóa khóa.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    # Một tiến trình chạy đủ master, volume, filer và cổng S3.
    command:
      - server
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '127.0.0.1:${S3_PORT:-8333}:8333' # API S3 (API dùng để upload, trình duyệt dùng presigned URL)
      - '127.0.0.1:${SEAWEEDFS_FILER_PORT:-8888}:8888' # giao diện xem tệp
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Chạy một lần sau khi SeaweedFS sẵn sàng: tạo bucket public (ảnh đại diện) và private (giấy tờ, tệp riêng).
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.53
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      # Tên bucket public phải trùng với quyền đọc ẩn danh trong docker/seaweedfs/s3.json.
      S3_BUCKET_PUBLIC: tps-public
      S3_BUCKET_PRIVATE: tps-private
    entrypoint: ['/bin/sh', '/scripts/create-buckets.sh']
    volumes:
      - ./docker/seaweedfs/create-buckets.sh:/scripts/create-buckets.sh:ro
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      # Nhận mọi tài khoản SMTP, để API dùng cùng cấu hình có đăng nhập như Gmail SMTP.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 5000
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '127.0.0.1:${SMTP_PORT:-1025}:1025' # SMTP
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025' # giao diện xem email
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pg18-data: # tên khác volume postgres-data (PostgreSQL 17) của bản cài trước
  redis-data:
  seaweedfs-data:
